<header class="app-header" th:fragment="fleetHeader">
    <div>
        <h1 class="title">ChainCheck<span th:if="${appTitle != null and !appTitle.isEmpty()}"
                th:text="' · ' + ${appTitle}"
                th:style="'font-weight: bold; color: ' + ${appTitleColor} + ';'"></span></h1>
    </div>
    <div class="header-controls">
        <button id="live-toggle" type="button" class="live-toggle" aria-pressed="true">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="live-label">Live · 10s</span>
        </button>
        <div class="range-selector">
            <span>Range:</span>
            <a th:each="r : ${ranges}"
               th:href="@{/(range=${r.key})}"
               th:text="${r.key}"
               th:classappend="${r} == ${range} ? 'active' : ''"></a>
        </div>
    </div>
</header>
