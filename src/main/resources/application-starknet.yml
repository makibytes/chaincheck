rpc:
  mode: starknet
  mode-type: starknet
  title: "Starknet Mainnet"
  title-color: "#ec796b"
  get-safe-blocks: false
  get-finalized-blocks: false
  scale-change-ms: 1000
  scale-max-ms: 60000
  anomaly-detection:
    # Starknet v0.14 ("Grinta", Sep 2025) cut block time from ~30s to 4-6s.
    # 60s of tolerated staleness (~10-12 blocks) absorbs the network's documented
    # block-time jitter while still flagging the multi-minute sequencer stalls
    # Starknet has experienced (Sep 2025, Jan 2026).
    stale-block-threshold-ms: 60000
    block-gap-threshold: 2
  # Polling intervals: optimal = 5s (matches Starknet's post-v0.14 4-6s block time), sparse = 30s
  requests:
    optimal-poll-interval-ms: 5000
    sparse-poll-interval-ms: 30000
  # WS is supported by Pathfinder and Juno nodes via starknet_subscribeNewHeads.
  # Nodes without a ws: entry fall back to HTTP polling automatically.
  nodes:
    - name: publicnode.com
      http: https://starknet-rpc.publicnode.com
      requests: sparse
    - name: nethermind.io
      http: https://free-rpc.nethermind.io/mainnet-juno
      requests: sparse
    - name: BlastAPI
      http: https://starknet-mainnet.public.blastapi.io
      requests: sparse
    - name: drpc.org
      http: https://starknet.drpc.org
      requests: sparse
    - name: lava.build
      http: https://rpc.starknet.lava.build
      requests: sparse
    - name: exinchain.com
      http: https://starknet-mainnet.rpc.exinchain.com
      requests: sparse
    - name: starknet.id
      http: https://rpc.starknet.id
      requests: sparse
